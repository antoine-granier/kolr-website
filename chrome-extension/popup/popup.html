<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=380">
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-brand">
      <img src="../icons/logo.png" alt="Kolr" style="width:24px;height:24px;border-radius:6px;">
      <span>Kolr</span>
    </div>
    <a href="https://kolr-app.vercel.app" target="_blank" class="header-link">Open Website →</a>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="pick">Pick</button>
    <button class="tab-btn" data-tab="extract">Extract</button>
    <button class="tab-btn" data-tab="palettes">Palettes</button>
    <button class="tab-btn" data-tab="tools">Tools</button>
  </div>

  <!-- Pick Tab -->
  <div class="tab-content active" id="tab-pick">
    <button class="btn btn-primary" id="btn-pick">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m2 22 1-1h3l9-9"/><path d="M3 21v-3l9-9"/><path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3L15 6"/></svg>
      Pick a Color
    </button>

    <div id="pick-result" style="display:none;">
      <div class="pick-result">
        <div class="swatch swatch-large" id="pick-swatch"></div>
        <div class="pick-info">
          <div class="pick-hex" id="pick-hex"></div>
          <div class="pick-formats" id="pick-formats"></div>
        </div>
        <div class="pick-actions">
          <button class="btn-icon" id="btn-copy-pick" title="Copy hex">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
          </button>
          <button class="btn-icon" id="btn-add-to-palette" title="Add to palette">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Building palette -->
    <div id="building-palette" style="display:none;">
      <div class="section-label">Building Palette</div>
      <div class="palette-card">
        <div class="palette-colors" id="building-colors"></div>
        <div class="palette-actions" style="margin-top:8px;">
          <button class="btn btn-primary btn-small" id="btn-save-building" style="flex:1;">Save Palette</button>
          <button class="btn-icon btn-danger" id="btn-clear-building" title="Clear">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="section-label" id="recent-label" style="display:none;">Recent Colors</div>
    <div class="color-grid" id="recent-colors"></div>
  </div>

  <!-- Extract Tab -->
  <div class="tab-content" id="tab-extract">
    <button class="btn btn-primary" id="btn-extract">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
      Extract Page Colors
    </button>
    <div id="extract-result" style="display:none;">
      <div class="section-label">Extracted Colors</div>
      <div class="color-grid" id="extracted-colors"></div>
      <p class="extract-info" id="extract-count"></p>
      <button class="btn btn-secondary btn-small" id="btn-save-extracted" style="margin-top:10px;width:100%;">
        Save as Palette
      </button>
    </div>
  </div>

  <!-- Palettes Tab -->
  <div class="tab-content" id="tab-palettes">
    <div id="palettes-list"></div>
    <div class="empty-state" id="palettes-empty">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.3;margin:0 auto 8px;display:block;"><circle cx="13.5" cy="6.5" r="0.5" fill="currentColor"/><circle cx="17.5" cy="10.5" r="0.5" fill="currentColor"/><circle cx="8.5" cy="7.5" r="0.5" fill="currentColor"/><circle cx="6.5" cy="12" r="0.5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.7-.7 1.7-1.5 0-.4-.2-.7-.4-1-.2-.3-.3-.6-.3-1 0-.8.7-1.5 1.5-1.5H16c3.3 0 6-2.7 6-6 0-5.5-4.5-10-10-10z"/></svg>
      <p>No palettes saved yet.<br>Pick or extract colors to get started.</p>
    </div>
  </div>

  <!-- Tools Tab -->
  <div class="tab-content" id="tab-tools">
    <div class="tools-grid" id="tools-grid"></div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="../lib/colors.js"></script>
  <script src="../lib/storage.js"></script>
  <script src="../lib/export.js"></script>
  <script src="popup.js"></script>

</body>
</html>
